services:
  selenium-hub:
    image: selenium/hub:4.18.1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:4444/status |
          grep -q '"ready": true'
      interval: 5s
      timeout: 3s
      retries: 20

  chrome:
    image: selenium/node-chrome:4.18.1
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_started
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

  test-runner:
    build: .
    environment:
      SELENIUM_HUB_URL: http://selenium-hub:4444
    depends_on:
      selenium-hub:
        condition: service_healthy
      chrome:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        python -c '
        import json, os, time, urllib.request
        url = os.environ["SELENIUM_HUB_URL"] + "/status"
        deadline = time.time() + 120
        while time.time() < deadline:
            try:
                with urllib.request.urlopen(url, timeout=3) as response:
                    status = json.load(response)["value"]
                nodes = status.get("nodes", [])
                if status.get("ready") and any(
                    node.get("availability") == "UP"
                    and any(
                        slot.get("stereotype", {}).get("browserName") == "chrome"
                        and slot.get("session") is None
                        for slot in node.get("slots", [])
                    )
                    for node in nodes
                ):
                    break
            except Exception:
                pass
            time.sleep(2)
        else:
            raise SystemExit("ERROR: Selenium Chrome node did not become ready")
        os.execvp("pytest", [
            "pytest", "-v",
            "--html=/reports/report.html",
            "--self-contained-html",
            "--junitxml=/reports/junit.xml",
            "tests/"
        ])
        '
    volumes:
      - ./reports:/reports
    restart: "no"

